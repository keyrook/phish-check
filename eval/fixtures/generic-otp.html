<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Verification</title>
<style>body{font-family:system-ui,sans-serif;background:#fafafa;margin:0}main{width:380px;margin:90px auto;background:#fff;padding:32px;border-radius:8px;border:1px solid #ddd;text-align:center}input{width:200px;padding:12px;font-size:22px;letter-spacing:8px;text-align:center}button{margin-top:20px;width:200px;padding:10px;background:#333;color:#fff;border:0;border-radius:4px}</style></head>
<body><main><h1>Two-step verification</h1><p>Enter the 6-digit code from your authenticator app.</p>
<form onsubmit="return false"><input inputmode="numeric" autocomplete="one-time-code" maxlength="6"><br><button>Verify</button></form></main></body></html>
